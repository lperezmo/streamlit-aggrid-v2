[project]
name = "streamlit-aggrid-v2"
version = "0.2.7"
description = "AG Grid component for Streamlit: interactive tables, editing, filtering and more."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luis Perez", email = "lperezmo@users.noreply.github.com" }]
keywords = ["streamlit", "ag-grid", "aggrid", "component", "data-table"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
]
dependencies = ["streamlit >=1.51", "pandas >=1.4.0", "python-decouple"]

[project.urls]
Homepage = "https://github.com/lperezmo/st-aggrid"
Repository = "https://github.com/lperezmo/st-aggrid"
Issues = "https://github.com/lperezmo/st-aggrid/issues"






[dependency-groups]
dev = [
    "beautifulsoup4>=4.12",
    "playwright>=1.51.0",
    "pytest>=8.3.5",
    "pytest-playwright>=0.7.0",
    "watchdog>=6.0.0",
    # Pinned to the 0.16 line because the lint config relies on that
    # generation's default rule set (413 rules, up from 59). An older ruff
    # reports a small subset and disagrees with CI. The upper bound matters
    # just as much: `astral-sh/ruff-action` reads this constraint and installs
    # the newest release satisfying it, so an unbounded floor lets the next
    # default expansion turn CI red on unchanged code, which is exactly what
    # 0.16.0 already did once here. Raising this is a deliberate change with
    # its own triage pass.
    "ruff>=0.16,<0.17",
    "streamlit-code-editor>=0.1.12",
    "pytest-cov>=6.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/st_aggrid"]
artifacts = [
    "src/st_aggrid/frontend/build/**/*",
    "src/st_aggrid/json/**/*.json",
    "src/st_aggrid/pyproject.toml",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/st_aggrid/**/*.py",
    "src/st_aggrid/frontend/build/**/*",
    "src/st_aggrid/json/**/*.json",
    "src/st_aggrid/pyproject.toml",
]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
    "src/st_aggrid/pyproject.toml:project.version",
]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"

[tool.pytest.ini_options]
# CI selects suites by marker, not by filename. Listing files in the workflow
# is how five e2e files and roughly fifty browser-less tests ended up never
# running: each was added in a commit that did not touch tests.yml, so it was
# dropped by omission and nobody noticed. With markers, a new test file joins
# the right CI job by default and silence means "no tests", not "not wired up".
markers = [
    "browser: needs a real browser and a running Streamlit server (Playwright)",
]

[tool.ruff]
extend-exclude = ["development/"]

[tool.ruff.lint]
# No explicit `select`: the rule set is ruff's own default, which 0.16.0 grew
# from 59 rules to 413. The dev dependency floor is `ruff>=0.16` so that a
# local run and the CI run agree on what "default" means; an older ruff would
# silently check a much smaller set and let new findings through.
ignore = [
    # TRY004 wants TypeError where AgGrid() raises ValueError for an argument
    # of the wrong type. Those ValueErrors are the documented, long-standing
    # public behavior of the entry point (v1 raised them too) and user code
    # catches them; swapping the class is an API break, not a lint fix.
    "TRY004",
]

[tool.ruff.lint.isort]
# `utils` (examples), `e2e_utils` and `grid_stub` (tests) are sibling modules
# imported by path, not installed packages. Without this they sort into the
# third-party block, above st_aggrid itself, which reads as if the example
# apps were importing the library from somewhere else.
known-local-folder = ["e2e_utils", "grid_stub", "utils"]

[tool.ruff.lint.per-file-ignores]
# N999 flags these module names as non-snake_case. They are public import
# paths: `from st_aggrid.AgGrid import AgGrid` and
# `from st_aggrid.AgGridReturn import AgGridReturn` are documented and used in
# the wild, so renaming the files to satisfy a naming rule would break every
# such import.
"src/st_aggrid/AgGrid.py" = [
    "N999",
    # Blind `except Exception` is the deliberate shape of the two error
    # boundaries in this file, not an oversight: the component call and the
    # collector call both wrap arbitrary user code (JsCode, custom collectors,
    # object-dtype frames) and re-raise with a hint that names the likely
    # cause. Narrowing them would turn a helpful message into a raw stack
    # trace in the user's app. It is scoped to these two files so a blind
    # except anywhere else still gets flagged: the two enum lookups that used
    # to hide behind a project-wide ignore were plain `DataReturnMode[...]` /
    # `GridUpdateMode[...]` KeyErrors and are now caught as such.
    "BLE001",
]
"src/st_aggrid/AgGridReturn.py" = [
    "N999",
    # The dtype round-trip is the third error boundary: conversion_errors
    # ="ignore" is documented as "returns input unchanged on failure", and
    # what pandas raises for a given uncoercible cell is not enumerable, so
    # the fallback has to catch everything rather than crash a whole grid over
    # one cell.
    "BLE001",
]
# PYI034 wants `__enter__` to be annotated with `typing.Self`, which is 3.11+.
# The package supports 3.10 and does not depend on typing_extensions, so the
# class name is the only annotation available. Only this test helper defines
# context managers, so the exemption belongs here rather than project-wide.
"test/e2e_utils.py" = ["PYI034"]
