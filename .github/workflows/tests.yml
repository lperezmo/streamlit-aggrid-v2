name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          args: check src test scripts

  # src/st_aggrid/_event_catalog.py is generated from the bundled AG Grid types
  # and committed, so bumping ag-grid-community without regenerating would ship
  # a catalog that no longer matches the grid. What trips this is the lockfile
  # rather than package.json, because bun install --frozen-lockfile installs
  # from the lockfile.
  #
  # Not hypothetical: the scraped JSON snapshot this generator replaced drifted
  # 20 events behind, so update_on would have warned about event names that were
  # perfectly valid. --check re-parses the types and fails here instead.
  catalog:
    name: Event catalog fresh (run scripts/gen_event_catalog.py if red)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # No `bun run build` here, unlike the other jobs: the generator only reads
      # the .d.ts files and package.json of the installed ag-grid-community, so
      # the bundle is irrelevant and building it would triple the job time.
      # --production is enough because ag-grid-community is a regular
      # dependency, and the published tarball carries dist/types, so nothing has
      # to compile.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: src/st_aggrid/frontend/package.json
      - run: bun install --production --frozen-lockfile
        working-directory: src/st_aggrid/frontend

      # The generator imports stdlib only, so a bare interpreter is the whole
      # dependency list: no uv, no uv sync, no wheel build.
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: python scripts/gen_event_catalog.py --check

  # The whole browser-less suite, on every supported Streamlit version. It was
  # called "Smoke" back when it ran a registration check alone; it now runs all
  # 177 non-browser tests, and the old name undersold it badly enough that the
  # matrix looked optional. It is not: the pandas 3 NaT regression showed up
  # only on the "latest" leg, and API drift like isolate_styles moving between
  # the registration call (>= 1.53) and the per-call renderer (1.51 / 1.52) is
  # invisible to every other job.
  python-suite:
    name: Python (Streamlit ${{ matrix.streamlit || 'latest' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        streamlit: ['1.51.*', '1.52.*', '1.53.*', '1.54.*', '1.55.*', '1.56.*', '1.57.*', '1.58.*', '']
    steps:
      - uses: actions/checkout@v6

      # The conftest builds and installs the wheel; without a frontend build
      # the wheel ships no assets and component discovery cannot resolve
      # asset_dir, failing registration on every Streamlit version.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: src/st_aggrid/frontend/package.json
      - run: bun install --frozen-lockfile && bun run build
        working-directory: src/st_aggrid/frontend

      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Select Streamlit version
        run: |
          if [ -n "${{ matrix.streamlit }}" ]; then
            uv pip install "streamlit==${{ matrix.streamlit }}"
          else
            uv pip install -U streamlit
          fi
      - run: uv run --no-sync python -c "import streamlit; print('streamlit', streamlit.__version__)"
      # Everything that does not need a browser, selected by marker so a new
      # test file is picked up without editing this workflow. Running it on
      # every Streamlit version is deliberate: the Python layer is where API
      # drift bites, and these tests are fast.
      - run: uv run --no-sync pytest test/ -m "not browser" -v

  # Every other job runs 3.13, so this one exercises the requires-python floor
  # (">=3.11"). That gap once shipped a real bug: when the floor was 3.10, the
  # exception re-wrap used BaseException.add_note, which is 3.11+, and on 3.10
  # it silently fell back to rebuilding the error as a RuntimeError, destroying
  # the original exception type. Nothing caught it because nothing ran 3.10.
  floor:
    name: Python floor (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: src/st_aggrid/frontend/package.json
      - run: bun install --frozen-lockfile && bun run build
        working-directory: src/st_aggrid/frontend

      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev --python 3.11
      - run: uv run --no-sync python -c "import sys; print(sys.version)"
      - run: uv run --no-sync pytest test/ -m "not browser" -v

  # The frontend unit tests are plain bun test: no browser, no Python, no
  # wheel. test/security.test.ts guards the JsCode rowData boundary, the
  # CSV/Excel formula neutralization, and the theme-signature variable list, so
  # it runs as its own cheap job instead of hiding inside the e2e suite. The
  # same job type-checks the frontend, tests included.
  frontend-security:
    name: Frontend security tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: src/st_aggrid/frontend/package.json
      - run: bun install --frozen-lockfile
        working-directory: src/st_aggrid/frontend
      - run: bun test
        working-directory: src/st_aggrid/frontend
      - run: bun run typecheck
        working-directory: src/st_aggrid/frontend

  # bun fmt and bun lint are canary-only until they reach a stable release, so
  # this job runs canary while every other job stays on the bun version pinned
  # in package.json. Neither needs node_modules.
  format-and-lint:
    name: Format and lint frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      - run: bun fmt --check .
        working-directory: src/st_aggrid/frontend
      - run: bun lint --max-warnings 0 --format github
        working-directory: src/st_aggrid/frontend

  e2e:
    name: CCv2 e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Frontend build is required: the test conftest builds the wheel via
      # `uv build`, and hatchling silently produces an empty wheel if
      # src/st_aggrid/frontend/build/ doesn't exist.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: src/st_aggrid/frontend/package.json
      - run: bun install --frozen-lockfile && bun run build
        working-directory: src/st_aggrid/frontend

      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --group dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run e2e tests
        run: uv run pytest test/ -m browser -v

      - name: Upload Playwright test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
