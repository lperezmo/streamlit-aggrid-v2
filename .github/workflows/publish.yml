name: Build & Publish to PyPI (Manual)

# Fallback for manual tag-based releases.
# Automated releases are handled by release.yml via python-semantic-release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Build frontend
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: src/st_aggrid/frontend/package.json
          # Release builds resolve from the lockfile alone, never a cache.
          no-cache: true
      - run: bun install --frozen-lockfile && bun run build
        working-directory: src/st_aggrid/frontend

      # Build Python package
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          attestations: false
