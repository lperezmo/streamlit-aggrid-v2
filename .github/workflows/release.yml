name: Release & Publish

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v6
      with: { python-version: '3.13' }

    - name: Install Semantic Release
      run: >-
        python -m pip install
        "python-semantic-release==9.21.2"
        "GitPython==3.1.59"

    - name: Semantic Release
      id: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: semantic-release -v version

  publish:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      # Build frontend
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - run: npm ci && npm run build
        working-directory: src/st_aggrid/frontend

      # Build Python package
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m build --sdist

      # Upload dists to the GitHub Release that semantic-release already created
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/*
          --clobber

      # Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          attestations: false

  bump-demo:
    # publish, not just release: the demo app's requirements.txt must never
    # name a version PyPI cannot serve yet. Depending on release alone ran this
    # job alongside publish, so the bump commit landed - and the demo app
    # redeployed against it - before the wheel had been uploaded at all.
    needs: [release, publish]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }

      # A successful upload is not the same as an installable release: the
      # index and the CDN in front of the files take their own time to catch
      # up. Poll the thing the demo app actually does - resolve and fetch the
      # wheel from PyPI - rather than sleeping a fixed guess.
      - name: Wait for the release to be installable from PyPI
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          dest="$(mktemp -d)"
          deadline=$(( SECONDS + 600 ))
          attempt=0
          until pip download "streamlit-aggrid-v2==${VERSION}" \
              --no-deps --only-binary=:all: --no-cache-dir \
              --dest "$dest" >/dev/null 2>&1; do
            attempt=$(( attempt + 1 ))
            if (( SECONDS >= deadline )); then
              echo "::error::streamlit-aggrid-v2==${VERSION} was still not"\
                   "installable from PyPI after 10 minutes. The demo app was"\
                   "left on the previous version; re-run this job once the"\
                   "release shows up on PyPI."
              exit 1
            fi
            echo "Attempt ${attempt}: ${VERSION} not on PyPI yet, retrying in 15s"
            sleep 15
          done
          # This runner reached one CDN edge; the one serving the demo app's
          # build may be a few seconds behind it.
          echo "${VERSION} is installable. Letting the CDN settle for 30s."
          sleep 30

      - name: Bump demo app version requirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=${{ needs.release.outputs.version }}
          sed -i "s/streamlit-aggrid-v2>=.*/streamlit-aggrid-v2>=${VERSION}/" examples/requirements.txt
          git add examples/requirements.txt
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: bump demo app requirement to v${VERSION}"
          git push
