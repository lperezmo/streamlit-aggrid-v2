version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
      uv-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/src/st_aggrid/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
