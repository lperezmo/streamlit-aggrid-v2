version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
      uv-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "bun"
    directory: "/src/st_aggrid/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # AG Grid's packages must share one version, and ag-charts-enterprise has
      # to match the charts major the grid was built against. Separate PRs for
      # them can never pass CI (a second ag-grid-community gets nested and tsc
      # rejects the mixed types), so they move together, majors included.
      # Listed first so it claims these packages before bun-version does.
      ag-grid:
        applies-to: version-updates
        patterns: ["ag-grid-*", "ag-charts-*"]
      # react and react-dom must stay on the same major (react-dom pins react
      # as a peer), and the type packages follow them. Bumped one at a time,
      # a major lands half-applied and breaks the build.
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
      bun-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
