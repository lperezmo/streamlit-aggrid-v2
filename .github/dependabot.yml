version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
      uv-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/src/st_aggrid/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # AG Grid's packages must share one version, and ag-charts-enterprise has
      # to match the charts major the grid was built against. Separate PRs for
      # them can never pass CI (npm nests a second ag-grid-community and tsc
      # rejects the mixed types), so they move together, majors included.
      # Listed first so it claims these packages before npm-version does.
      ag-grid:
        applies-to: version-updates
        patterns: ["ag-grid-*", "ag-charts-*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-version:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
